services:
  backend:
    build: ./server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/data/dev.db
      - JWT_SECRET=${JWT_SECRET}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - CORS_ORIGIN=*
    volumes:
      - pgdata:/data # SQLite 文件持久化，容器删了数据还在
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - '80:80' # 别人访问 http://服务器IP
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
